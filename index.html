<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NullVoid — PvP Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #070a0d; color: #ffffff; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
        ul { list-style: none; }

        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background: url('bg.jpg') no-repeat center center; background-size: cover;
            filter: blur(8px) brightness(0.4); transform: scale(1.05);
        }
        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.1) 0%, #070a0d 90%);
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        .navbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1050px; display: flex; justify-content: space-between;
            align-items: center; padding: 14px 28px;
            background: rgba(12,15,20,0.6); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; z-index: 1000;
        }
        .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; }
        .logo i { color: #3b82f6; font-size: 20px; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { font-size: 14px; font-weight: 500; color: #94a3b8; }
        .nav-links a:hover { color: #fff; }
        .nav-btn {
            background: rgba(255,255,255,0.06); padding: 8px 20px; border-radius: 10px;
            font-weight: 600; font-size: 14px; border: 1px solid rgba(255,255,255,0.06);
            color: #fff; display: flex; align-items: center; gap: 8px;
        }
        .nav-btn:hover { background: #3b82f6; border-color: #3b82f6; }

        .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 140px 20px 0; }
        .hero h1 { font-size: 4.5rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 15px; line-height: 1.1; }
        .hero h1 span { background: linear-gradient(135deg, #fff, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: #94a3b8; font-size: 1.1rem; max-width: 550px; margin-bottom: 40px; }
        .hero-btns { display: flex; gap: 15px; }
        .btn-main { background: #fff; color: #070a0d; padding: 14px 34px; border-radius: 12px; font-weight: 700; display: flex; gap: 10px; cursor: pointer; }
        .btn-main:hover { transform: translateY(-3px); }
        .btn-alt { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); padding: 14px 34px; border-radius: 12px; font-weight: 700; color: #fff; cursor: pointer; }
        .btn-alt:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); }

        .showcase-wrapper { position: relative; width: 100%; display: flex; justify-content: center; margin-top: 60px; }
        .showcase-container { width: 85%; max-width: 900px; background: rgba(14,17,23,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.04); border-radius: 20px; padding: 20px 20px 0 20px; box-shadow: 0 -20px 50px rgba(0,0,0,0.6); }
        .showcase-image { width: 100%; height: auto; border-radius: 12px 12px 0 0; background: #0e1117; display: block; min-height: 200px; object-fit: cover; }

        .buy-section { padding: 80px 20px 120px; text-align: center; }
        .buy-section h2 { font-size: 3rem; font-weight: 700; margin-bottom: 15px; }
        .buy-section p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }
        .buy-btn-big {
            background: #3b82f6; padding: 18px 50px; border-radius: 14px; font-weight: 700;
            font-size: 1.2rem; display: inline-flex; align-items: center; gap: 10px;
            box-shadow: 0 0 30px rgba(59,130,246,0.3); transition: 0.3s;
        }
        .buy-btn-big:hover { transform: translateY(-3px); box-shadow: 0 0 50px rgba(59,130,246,0.5); }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.8rem; }
            .navbar { top: 10px; padding: 12px 16px; width: 95%; flex-wrap: wrap; gap: 10px; }
            .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
            .showcase-container { width: 100%; border-radius: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="bg-gradient"></div>

    <nav class="navbar">
        <div class="logo"><i class="fas fa-bolt"></i> NULLVOID</div>
        <div class="nav-links">
            <a href="pricing.html">Купить</a>
            <a href="https://discord.gg/YexVZA4g7w" target="_blank">Поддержка</a>
        </div>
    </nav>

    <div class="hero" id="home">
        <div>
            <h1>Играй быстрее.<br>Побеждай <span>увереннее</span>.</h1>
            <p>NullVoid создан для тех, кому нужна стабильность и превосходство. Никакой воды, только инструмент, который работает.</p>
            <div class="hero-btns">
                <a href="pricing.html" class="btn-main">Купить <i class="fas fa-arrow-right"></i></a>
                <a href="https://discord.gg/YexVZA4g7w" target="_blank" class="btn-alt">Наш Discord</a>
            </div>
        </div>

        <div class="showcase-wrapper">
            <div class="showcase-container">
                <img src="screenshot.png" onerror="this.style.display='none'" class="showcase-image" alt="NullVoid Menu">
            </div>
        </div>
    </div>

    <section class="buy-section">
        <div class="container">
            <h2>Готов к покупке?</h2>
            <p>Перейди в магазин, чтобы выбрать подходящий тариф.</p>
            <a href="pricing.html" class="buy-btn-big"><i class="fas fa-shopping-cart"></i> Перейти в магазин</a>
        </div>
    </section>

</body>
</html>
